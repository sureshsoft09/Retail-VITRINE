[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vitrine-agents"
version = "0.1.0"
description = "VITRINE Autonomy & Transaction Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]
