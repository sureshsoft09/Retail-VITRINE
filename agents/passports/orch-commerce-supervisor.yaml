# agents/passports/orch-commerce-supervisor.yaml
agent:
  id: orch-commerce-supervisor
  version: 1.0.0
  owner_role: Chief Commercial Officer
  tier: M
model_pin:
  primary: gemini-2.5-pro
  region: us-central1
  prompt_version: supervisor.v1
authority:
  autonomy_tier: A2
  value_caps:
    max_order_usd: 250.0
    max_discount_pct: 15.0
tool_grants:
