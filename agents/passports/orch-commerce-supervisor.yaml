    - transfer_to_agent
    - get_session_state
    - update_session_state
    - publish_step_event
    - evaluate_commitment_gate
    - append_ledger_record
guardrails:
  - armor_and_isolate
  - validate_numeric_computation_ids
  - fail_closed_on_critic_objection
